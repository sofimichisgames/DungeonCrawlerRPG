name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Generar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.6

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: DungeonCrawlerRPG-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Eliminar releases anteriores
        run: |
          # Delete all releases with tag "latest-build" to replace with new one
          RELEASE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest-build")

          RELEASE_ID=$(echo "$RELEASE" | grep -o '"id": [0-9]*' | head -1 | grep -o '[0-9]*')

          if [ ! -z "$RELEASE_ID" ]; then
            curl -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
            echo "Deleted old release: $RELEASE_ID"
          fi

      - name: Publicar APK en Releases
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest-build
          release_name: Latest Build
          body: "Latest APK build - Built from commit ${{ github.sha }}\n\nThis release is automatically updated with each successful build."
          draft: false
          prerelease: false

      - name: Subir APK a Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./app/build/outputs/apk/debug/app-debug.apk
          asset_name: DungeonCrawlerRPG-latest.apk
          asset_content_type: application/vnd.android.package-archive
