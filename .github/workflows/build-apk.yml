name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Generar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.6

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: DungeonCrawlerRPG-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Eliminar y crear Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          name: Latest Build
          body: "Latest APK build - Built from commit ${{ github.sha }}\n\nThis release is automatically updated with each successful build."
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          generate_release_notes: false
